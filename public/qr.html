<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{EVENT_NAME}} – QR code</title>
<style>
  :root{--ink:#4b5a52;--accent:#f08a2c;--ground:#f7f3ed}
  *{box-sizing:border-box}
  html,body{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--ground);text-align:center}
  /* watermark: the tree mark repeated, faint, behind everything (an inline SVG so it also prints) */
  .wm{position:fixed;inset:0;width:100%;height:100%;z-index:0;opacity:.11;mix-blend-mode:multiply;pointer-events:none}
  .page{position:relative;z-index:1;max-width:820px;margin:0 auto;padding:28px 16px 32px;display:flex;flex-direction:column;align-items:center;gap:18px}
  .logo{width:min(520px,86vw);height:auto;display:block}
  h1{margin:6px 0 0;font-size:clamp(28px,6vw,54px);line-height:1.1;color:var(--ink)}
  h1 span{color:var(--accent)}
  .sub{margin:0;font-size:clamp(16px,2.6vw,20px)}
  /* the QR code sits on solid white with its own quiet zone: the watermark never touches it */
  .card{background:#fff;border-radius:22px;padding:18px;box-shadow:0 10px 34px rgba(75,90,82,.18);border:3px solid var(--accent)}
  .card svg{display:block;width:min(72vw,56vh,520px);height:auto}
  .url{margin:0;font-size:clamp(14px,2.4vw,19px);word-break:break-all;background:rgba(255,255,255,.75);padding:4px 10px;border-radius:8px}
  button{font:inherit;font-weight:600;border:0;border-radius:10px;background:var(--ink);color:#fff;padding:10px 22px;cursor:pointer}
  @media print{
    @page{margin:12mm}
    button{display:none}
    .page{padding-top:0}
    .card{box-shadow:none}
  }
</style>
</head>
<body>
<svg class="wm" aria-hidden="true" focusable="false">
  <defs>
    <pattern id="marks" width="200" height="220" patternUnits="userSpaceOnUse" patternTransform="rotate(-14)">
      <image href="/brand/mark.png" x="18" y="16" width="64" height="76"/>
      <image href="/brand/mark.png" x="118" y="126" width="64" height="76"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#marks)"/>
</svg>
<main class="page">
  <img class="logo" src="/brand/logo.png" alt="{{EVENT_NAME}}">
  <h1>Scan to join the <span>luck draw</span></h1>
  <p class="sub">Sign in at our booth and spin the wheel</p>
  <div class="card">{{QR_SVG}}</div>
  <p class="url">{{URL}}</p>
  <button onclick="window.print()">Print</button>
</main>
</body>
</html>
